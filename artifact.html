<title>旅程產生器</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;700&display=swap">
<style>
:root{
  --bg:#F2F5F1; --surface:#FFFFFF; --surface-2:#E8EEE9; --ink:#1B2A2C; --muted:#5E6F6B; --line:#D3DCD6;
  --accent:#23705F; --accent-ink:#FFFFFF; --accent-soft:#DDEEE7; --stamp:#B8412C; --stamp-soft:#F7E3DD;
  --warn:#8A5A00; --warn-soft:#FBF0D6;
  --c1:#23705F; --c2:#3F7FB5; --c3:#C08A2E; --c4:#9A5AA6; --c5:#B8412C;
  --display:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#111918; --surface:#18221F; --surface-2:#1F2B28; --ink:#E4ECE8; --muted:#95A6A1; --line:#2E3C38;
    --accent:#5CC2A5; --accent-ink:#0E1614; --accent-soft:#1C3530; --stamp:#E57B63; --stamp-soft:#3A221D;
    --warn:#E3B55A; --warn-soft:#352A14;
    --c1:#5CC2A5; --c2:#6FA8DC; --c3:#D9A94F; --c4:#C18BCB; --c5:#E57B63;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#111918; --surface:#18221F; --surface-2:#1F2B28; --ink:#E4ECE8; --muted:#95A6A1; --line:#2E3C38;
  --accent:#5CC2A5; --accent-ink:#0E1614; --accent-soft:#1C3530; --stamp:#E57B63; --stamp-soft:#3A221D;
  --warn:#E3B55A; --warn-soft:#352A14;
  --c1:#5CC2A5; --c2:#6FA8DC; --c3:#D9A94F; --c4:#C18BCB; --c5:#E57B63;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.6;padding-inline:16px;padding-block:20px 48px}
.wrap{max-width:1180px;margin:0 auto;display:grid;gap:20px}
header.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:8px 20px;border-bottom:2px solid var(--ink);padding-bottom:10px}
header.top h1{font-family:var(--display);font-size:clamp(26px,4vw,36px);margin:0;letter-spacing:.04em;text-wrap:balance}
header.top p{margin:0;color:var(--muted);font-size:13px;max-width:62ch}
.layout{display:grid;grid-template-columns:minmax(0,340px) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:860px){.layout{grid-template-columns:minmax(0,1fr)}}
aside.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px);display:grid;gap:14px}
@media (max-width:860px){aside.panel{position:static}}
.ticket-head{display:flex;justify-content:space-between;align-items:center;font-family:var(--mono);font-size:12px;letter-spacing:.12em;color:var(--accent);border-bottom:1px dashed var(--line);padding-bottom:8px}
.field{display:grid;gap:4px}
.field label,.lbl{font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.06em}
.row2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
aside.panel,form,.field{min-width:0}
main,aside.panel,section.block,.card,.hero,form>div{grid-template-columns:minmax(0,1fr)}
input,select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:8px 10px;width:100%;min-width:0}
textarea{min-height:64px;resize:vertical}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:999px;padding:3px 11px;font-size:13px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
button{font:inherit;cursor:pointer}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:8px 14px;font-weight:500}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700;padding:11px 14px;width:100%;font-size:16px}
.btn.primary:disabled{opacity:.6;cursor:progress}
.btn.small{padding:5px 10px;font-size:13px}
.status{font-size:13px;color:var(--muted);min-height:1.4em}
.status.err{color:var(--stamp)}
.progress{display:flex;gap:10px;align-items:center;font-family:var(--mono);font-size:12px;color:var(--muted)}
.bar{flex:1;height:4px;background:var(--surface-2);border-radius:2px;overflow:hidden}
.bar i{display:block;height:100%;width:30%;background:var(--accent);animation:slide 1.4s ease-in-out infinite}
@keyframes slide{0%{transform:translateX(-100%)}100%{transform:translateX(340%)}}
@media (prefers-reduced-motion:reduce){.bar i{animation:none;width:100%;opacity:.5}}
.note{font-size:12px;color:var(--muted);margin:0}
main{display:grid;gap:18px;min-width:0}
.banner{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between;background:var(--warn-soft);color:var(--ink);border-radius:8px;padding:10px 14px;font-size:13px}
.banner b{color:var(--warn)}
.hero{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px;display:grid;gap:10px}
.hero h2{font-family:var(--display);font-size:clamp(22px,3vw,28px);margin:0;text-wrap:balance}
.hero .route{font-family:var(--mono);font-size:13px;letter-spacing:.08em;color:var(--accent)}
.hero p{margin:0;max-width:70ch}
.actions{display:flex;flex-wrap:wrap;gap:8px}
nav.jump{display:flex;gap:4px;flex-wrap:wrap;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding-block:6px;z-index:2;border-bottom:1px solid var(--line)}
nav.jump a{font-size:13px;color:var(--muted);text-decoration:none;padding:4px 10px;border-radius:6px}
nav.jump a:hover{background:var(--surface-2);color:var(--ink)}
section.block{display:grid;gap:12px;scroll-margin-top:52px}
section.block>h3{font-family:var(--display);font-size:20px;margin:0;display:flex;align-items:baseline;gap:10px}
section.block>h3 small{font-family:var(--body);font-size:12px;color:var(--muted);font-weight:400}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:grid;gap:8px;min-width:0}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.kv{display:flex;justify-content:space-between;gap:10px;font-size:14px}
.kv span:first-child{color:var(--muted)}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.links{display:flex;flex-wrap:wrap;gap:6px}
.links a{font-size:13px;color:var(--accent);text-decoration:none;border:1px solid var(--accent-soft);background:var(--accent-soft);border-radius:6px;padding:3px 9px}
.links a:hover{border-color:var(--accent)}
ul.clean{margin:0;padding-left:18px;display:grid;gap:3px}
.stay h4,.day h4{margin:0;font-size:16px}
.cand{display:grid;gap:4px;border-top:1px dashed var(--line);padding-top:8px}
.cand .top{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.cand .price{font-family:var(--mono);font-size:13px}
.day{gap:10px}
.dayhead{display:flex;gap:12px;align-items:baseline;flex-wrap:wrap}
.date{font-family:var(--mono);font-size:13px;font-weight:600;color:var(--accent-ink);background:var(--accent);border-radius:5px;padding:1px 8px}
.base{font-size:13px;color:var(--muted)}
.leg{display:grid;gap:4px}
.leg .legname{font-size:13px;font-weight:700;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.leg .legname a{font-weight:400;color:var(--accent);font-size:12px;text-decoration:none}
.tr{display:grid;grid-template-columns:minmax(96px,auto) 1fr auto;gap:2px 10px;align-items:center;border:1px solid var(--line);border-radius:7px;padding:5px 9px;font-size:13px}
.tr .t{font-family:var(--mono);font-weight:600;white-space:nowrap}
.tr .t small{font-weight:500;color:var(--muted)}
.tr .pf{font-size:12px;text-align:right;white-space:nowrap;color:var(--muted)}
.tr .nt{grid-column:1/-1;font-size:12px;color:var(--muted)}
.tr.rec{border:2px solid var(--stamp);background:var(--stamp-soft)}
.stamp{display:inline-block;border:1.5px solid var(--stamp);color:var(--stamp);font-size:11px;font-weight:700;border-radius:4px;padding:0 4px;margin-right:6px;transform:rotate(-3deg)}
details.more summary{cursor:pointer;font-size:13px;color:var(--accent);font-weight:500}
details.more[open] summary{margin-bottom:6px}
.costbar{display:flex;height:16px;border-radius:4px;overflow:hidden;background:var(--surface-2)}
.costbar span{display:block;height:100%;min-width:2px}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.total{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 18px}
.total b{font-family:var(--mono);font-size:26px}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:520px;font-size:13px}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--muted);font-weight:500;font-size:12px}
td.r,th.r{text-align:right;font-family:var(--mono);white-space:nowrap}
.controls{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:end}
.controls .field{min-width:140px}
.saved{display:grid;grid-template-columns:minmax(0,1fr);gap:6px;min-width:0}
.saved .it>a{flex:none}
.saved .it{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px;border-top:1px solid var(--line);padding-top:6px}
.saved .it span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.checklist li{list-style:none;margin-left:-18px;display:flex;gap:8px}
.checklist li::before{content:"□";color:var(--accent)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:8px;font-size:13px;z-index:5}
</style>

<div class="wrap">
  <header class="top">
    <h1>旅程產生器</h1>
    <p>填目的地、日期和人數，一次產生機票建議、住宿區域與候選、每日行程與交通班次、全程費用試算。價格與班次是 AI 估算，每一項都附查證連結。</p>
  </header>

  <div class="layout">
    <aside class="panel" aria-label="旅程條件">
      <div class="ticket-head"><span>TRIP REQUEST</span><span id="dayCount">6 DAYS</span></div>
      <form id="form" novalidate>
        <div style="display:grid;gap:12px">
          <div class="field"><label for="dest">目的地（可多城市）</label><input id="dest" required placeholder="例：北海道 札幌・小樽・富良野"></div>
          <div class="row2">
            <div class="field"><label for="origin">出發機場</label><input id="origin" value="TPE" maxlength="40"></div>
            <div class="field"><label for="travelers">人數</label><input id="travelers" type="number" min="1" max="12" value="2"></div>
          </div>
          <div class="row2">
            <div class="field"><label for="start">去程日</label><input id="start" type="date"></div>
            <div class="field"><label for="end">回程日</label><input id="end" type="date"></div>
          </div>
          <div class="row2">
            <div class="field"><label for="arriveBy">去程最晚抵達</label><input id="arriveBy" type="time" value="16:00"></div>
            <div class="field"><label for="departAfter">回程最早起飛</label><input id="departAfter" type="time" value="10:00"></div>
          </div>
          <div class="row2">
            <div class="field"><label for="budget">總預算（NT$，全員）</label><input id="budget" type="number" min="0" step="1000" value="60000"></div>
            <div class="field"><label for="hotelBudget">每晚住宿上限（NT$）</label><input id="hotelBudget" type="number" min="0" step="500" value="4000"></div>
          </div>
          <div class="row2">
            <div class="field"><label for="pace">步調</label><select id="pace"><option value="輕鬆">輕鬆</option><option value="一般" selected>一般</option><option value="緊湊">緊湊</option></select></div>
            <div class="field"><label for="airline">航空</label><select id="airline"><option value="LCC 與傳統皆可">LCC 與傳統皆可</option><option value="只要傳統航空">只要傳統航空</option><option value="越便宜越好（可紅眼）">越便宜越好（可紅眼）</option></select></div>
          </div>
          <div class="field"><span class="lbl">興趣</span><div class="chips" id="interests"></div></div>
          <div class="field"><label for="luggage">行李</label><input id="luggage" value="去程 1 件托運、回程 2 件托運"></div>
          <div class="field"><label for="notes">其他條件（已訂的住宿、必去、不吃的東西…）</label><textarea id="notes" placeholder="例：第 3 晚想住溫泉旅館；已訂札幌站前飯店 3 晚"></textarea></div>
          <button class="btn primary" id="go" type="submit">產生整套行程</button>
          <div class="progress" id="progress" hidden><div class="bar"><i></i></div><span id="progTxt">思考中…</span><button type="button" class="btn small" id="stop">停止</button></div>
          <div class="status" id="status" role="status"></div>
          <p class="note" id="modeNote">產生時會用你自己的 Claude 額度（第一次會詢問同意），不需要 API 金鑰。一次約 1–3 分鐘。</p>
          <div id="manual" hidden style="display:grid;gap:8px">
            <div class="field"><label for="promptOut">① 複製提示詞，貼到 Claude（網頁版或 App 都可以）</label><textarea id="promptOut" readonly style="min-height:90px;font-size:12px"></textarea></div>
            <div class="actions"><button type="button" class="btn small" id="copyPrompt">複製提示詞</button><a class="btn small" href="https://claude.ai/new" target="_blank" rel="noopener noreferrer" style="text-decoration:none">開啟 Claude ↗</a></div>
            <div class="field"><label for="answerIn">② 把 Claude 回覆的 JSON 整段貼回這裡</label><textarea id="answerIn" placeholder="{ &quot;title&quot;: … }" style="min-height:90px;font-size:12px"></textarea></div>
            <button type="button" class="btn" id="applyAnswer">套用結果</button>
          </div>
        </div>
      </form>
      <div class="saved" id="savedBox" hidden>
        <div class="ticket-head"><span>SAVED TRIPS</span><span id="savedCount"></span></div>
        <div id="savedList"></div>
      </div>
    </aside>

    <main id="out" aria-live="polite"></main>
  </div>
</div>
<div class="toast" id="toast" hidden></div>

    if (c.optional && !optionalOn.has(i)) return;
    const cat=CATS.some(x=>x[0]===c.cat)?c.cat:"其他";
    rows.push({cat,label:c.label,local:Number(c.local)||0,note:c.note||"",idx:i});
  });
  const food=(t.foodLevels||{})[foodLevel]||0;
  if (food) rows.push({cat:"餐飲",label:`餐飲 ${days} 天×${p} 人`,local:food*days*p,note:{save:"省錢",normal:"一般",loose:"寬裕"}[foodLevel]});
  rows.forEach(r=>{ if (r.twd==null) r.twd=(r.local||0)*fx; });
  const total=rows.reduce((a,r)=>a+r.twd,0);
  return {rows,total,per:total/p,p};
}

function liveHotel(c){
  const r=c.trackId && L().hotels?.hotels?.[c.trackId]; if(!r) return "";
  const j=r.jalan||{}, b=r.booking||{};
  const parts=[];
  if (j.available && j.min) parts.push(`じゃらん ¥${fmt(j.min)}${j.roomsLeft?`（剩 ${j.roomsLeft} 間）`:""}`);
  else if (j.calendar!==undefined && !j.error) parts.push("じゃらん 客滿");
  if (b.found && !b.soldOut && b.price) parts.push(`Booking NT$${fmt(b.price)}`);
  return parts.length?`<div style="font-size:12px;color:var(--accent);font-weight:500">即時：${esc(parts.join("　"))}</div>`:"";
}

async function downloadTrip(){

  try { await downloads.save({filename:name,data:JSON.stringify(trip,null,1)}); toast("已下載"); }

const SCHEMA = `{
 "title": "行程標題（10–20 字）",
 "summary": "2–3 句說明整體路線與亮點",
 "currency": "當地貨幣代碼，如 JPY / KRW / THB / EUR",

 "flights": {"arriveAirport":"IATA","departAirport":"IATA","estTwdTotal":全員含行李來回估價（數字）,"advice":"建議航空公司/時段組合與理由（符合抵達與起飛時間限制）","tips":["…"]},
 "passes": [{"name":"交通票券","priceLocal":數字,"covers":"涵蓋範圍","verdict":"划不划算與原因"}],

 "days": [{"date":"YYYY-MM-DD","title":"當日主題","base":"當晚住哪個城市/區域","items":["依時間排序的行程（含建議時間）"],
   "legs":[{"leg":"A → B（路線名）","options":[{"dep":"HH:MM","arr":"HH:MM","train":"車種或交通方式","no":"","pf":"","apf":"","rec":true,"note":"為何建議"}],"tip":"轉乘/購票/陷阱提醒"}],
   "food":["平價在地吃法與區域"],"tips":["寄物、營業時間、票券、人潮等提醒"],"mapStops":["可在 Google 地圖搜尋的地點名（當地語言），依順序 2–7 個"]}],
 "costs": [{"cat":"交通 | 門票與活動 | 其他","label":"項目","local":全員合計當地幣（數字）,"note":"算法，如 ¥500×2","optional":false}],
 "foodLevels": {"save":每人每日當地幣,"normal":…,"loose":…},
 "checklist": ["出發前要自己完成的事：訂位、劃位、預約、簽證/入境登記、網卡…"]

function buildPrompt(req){
  return `你是資深自由行規劃師。依下列條件產生完整旅程，用繁體中文（地名可附當地文字）。
只回覆一個 JSON 物件，不要其他文字，格式如下：
${SCHEMA}

條件：
- 目的地：${req.destination}
- 出發機場：${req.origin}；日期 ${req.start} 出發、${req.end} 回程；共 ${req.days} 天 ${req.days-1} 晚；${req.travelers} 人
- 去程抵達不晚於 ${req.arriveBy}；回程起飛不早於 ${req.departAfter}；航空偏好：${req.airline}
- 總預算 NT$${req.budget}（全員）；每晚住宿上限約 NT$${req.hotelBudget}（一間）
- 步調：${req.pace}；興趣：${req.interests.join("、")||"不限"}
- 行李：${req.luggage}
- 其他：${req.notes||"無"}

規則：
1. days 必須逐日涵蓋 ${req.start} 到 ${req.end}，第一天含機場進城，最後一天含回機場並預留國際線 3 小時。
2. stays 的日期要連續涵蓋每一晚；每段給 2–3 間真實存在的候選，偏向交通方便、有獨立衛浴、在預算內。換城市時說明行李怎麼處理。
3. legs 只放需要搭車的段落，每段 2–3 個 options，恰好一個 rec=true。時刻用你所知的典型班距推估；車次 no 與月台 pf/apf 除非非常確定否則留空字串，不要編造。
4. 考慮日期當週的季節、節日、平日/假日與已知活動；有特殊活動寫進 items 或 tips。
5. 價格都用你所知的一般水準估計，寧可略高；不要虛構折扣。costs 不含機票、住宿、餐費（這三項另外計算）。
6. 字數精簡：items 每天 3–6 條、每條 40 字內；food 與 tips 各最多 3 條。`;
}
function normalize(raw, req){
  const t = (raw && typeof raw==="object") ? raw : {};
  const arr = v => Array.isArray(v) ? v : [];
  t.days = arr(t.days).map(d=>({...d, items:arr(d.items), legs:arr(d.legs).map(l=>({...l, options:arr(l.options)})), food:arr(d.food), tips:arr(d.tips), mapStops:arr(d.mapStops)}));
  t.stays = arr(t.stays).map(s=>({...s, candidates:arr(s.candidates)}));
  t.costs = arr(t.costs); t.passes = arr(t.passes); t.checklist = arr(t.checklist);
  t.flights = t.flights && typeof t.flights==="object" ? t.flights : {};
  t.flights.tips = arr(t.flights.tips);
  t.foodLevels = t.foodLevels || {};
  t.localToTwd = Number(t.localToTwd) > 0 ? Number(t.localToTwd) : 1;
  t.meta = {destination:req.destination, origin:req.origin, start:req.start, end:req.end, travelers:req.travelers, budgetTwd:req.budget, source:"ai", generatedAt:new Date().toISOString().slice(0,10)};
  if (!t.title) t.title = req.destination;
  if (!t.days.length) throw {code:"empty_plan"};
  return t;
}
const ERR = {
  not_granted:"沒有取得使用 Claude 的同意，無法產生。", sampling_disabled:"這個帳號目前不能從頁面呼叫 Claude。",
  rate_limited:"使用量已達上限或太頻繁，請稍後再試。", session_expired:"登入已過期，請重新登入 Claude。",
  invalid_json:"回覆格式不完整，請再按一次；天數很多時可先縮短行程。", refused:"這次的內容無法產生，請調整條件。",
  prompt_too_large:"條件太長，請縮短「其他條件」。", empty_plan:"沒有產生出每日行程，請再試一次。",
  upstream_error:"連線中斷，請再按一次。"
};
$("form").addEventListener("submit", async e => {
  e.preventDefault();
  const st=$("status"); st.className="status";
  const req = {destination:$("dest").value.trim(), origin:$("origin").value.trim()||"TPE", start:$("start").value, end:$("end").value,
    travelers:Math.max(1,parseInt($("travelers").value)||1), arriveBy:$("arriveBy").value||"不限", departAfter:$("departAfter").value||"不限",
    budget:parseInt($("budget").value)||0, hotelBudget:parseInt($("hotelBudget").value)||0, pace:$("pace").value, airline:$("airline").value,
    interests:[...picked], luggage:$("luggage").value.trim(), notes:$("notes").value.trim()};
  const n = nightsBetween(req.start, req.end);
  if (!req.destination){ st.className="status err"; st.textContent="請填目的地。"; $("dest").focus(); return; }
  if (!(n>=1)){ st.className="status err"; st.textContent="回程日要晚於去程日。"; return; }
  if (n>13){ st.className="status err"; st.textContent="一次最多 14 天，較長的旅程請分段產生。"; return; }
  req.days = n+1; lastReq = req;
  if (!sample){ $("manual").hidden=false; $("promptOut").value=buildPrompt(req); st.textContent="已產生提示詞，照下方 ①② 操作。"; $("promptOut").scrollIntoView({behavior:"smooth",block:"center"}); return; }
  ctl = new AbortController();
  $("go").disabled=true; $("progress").hidden=false; $("progTxt").textContent="思考中…"; st.textContent="";
  const t0=Date.now(); const tick=setInterval(()=>{ if ($("progTxt").dataset.chars) return; $("progTxt").textContent=`思考中… ${Math.round((Date.now()-t0)/1000)} 秒`; },1000);
  $("progTxt").dataset.chars="";
  try {
    const raw = await sample.json(buildPrompt(req), {signal:ctl.signal, cache:false, modelTier:"default",
      onText:({text})=>{ const days=(text.match(/"date"\s*:/g)||[]).length; $("progTxt").dataset.chars="1"; $("progTxt").textContent=`撰寫中… 第 ${Math.min(days,req.days)}／${req.days} 天　${Math.round((Date.now()-t0)/1000)} 秒`; }});
    trip = normalize(raw, req); fx = trip.localToTwd; optionalOn = new Set(); currentDocId = null; foodLevel="normal";
    render(); st.textContent=`完成，約 ${Math.round((Date.now()-t0)/1000)} 秒。`;
    window.scrollTo({top:0,behavior:"smooth"});
  } catch(err){
    if (err?.code!=="cancelled"){ st.className="status err"; st.textContent = ERR[err?.code] || ERR.upstream_error; }
    else st.textContent="已停止。";
  } finally { clearInterval(tick); $("go").disabled=false; $("progress").hidden=true; }
});
$("stop").onclick = () => ctl?.abort();
$("copyPrompt").onclick = async () => { const v=$("promptOut").value; try{ await navigator.clipboard.writeText(v); toast("已複製"); }catch{ $("promptOut").select(); toast("請按 Ctrl/⌘+C 複製"); } };
$("applyAnswer").onclick = () => {
  const st=$("status"); st.className="status";
  let txt=$("answerIn").value.trim(); const f=txt.match(/```(?:json)?\s*([\s\S]*?)```/); if (f) txt=f[1];
  const a=txt.indexOf("{"), b=txt.lastIndexOf("}");
  try {
    if (!lastReq) throw {code:"noreq"};
    const raw=JSON.parse(txt.slice(a,b+1));
    trip=normalize(raw,lastReq); fx=trip.localToTwd; optionalOn=new Set(); currentDocId=null; foodLevel="normal";
    render(); st.textContent="已套用。"; window.scrollTo({top:0,behavior:"smooth"});
  } catch(e){ st.className="status err"; st.textContent = e?.code==="noreq" ? "請先按「產生提示詞」再貼回結果。" : e?.code==="empty_plan" ? ERR.empty_plan : "貼上的內容不是完整的 JSON，請確認整段都有複製（Claude 回覆太長被截斷時，請它「繼續」後合併）。"; }
};

async function loadRepoTrip(){
  let slug=null; try{ slug=new URLSearchParams(location.search).get("trip"); }catch{}
  if (location.protocol!=="https:" && location.protocol!=="http:") return;
  try {
    const idx=await fetch("trips/index.json",{cache:"no-store"}).then(r=>r.ok?r.json():[]);
    if (Array.isArray(idx) && idx.length){
      const box=document.createElement("div"); box.className="saved";
      box.innerHTML=`<div class="ticket-head"><span>VERIFIED TRIPS</span><span>${idx.length}</span></div>`+idx.map(x=>`<div class="it"><span>${esc(x.start||"")}　${esc(x.title||x.slug)}</span><a class="btn small" style="text-decoration:none" href="?trip=${enc(x.slug)}">開啟</a></div>`).join("");
      document.querySelector("aside.panel").append(box);
    }
  } catch {}
  if (!slug || !/^[a-z0-9-]+$/i.test(slug)) return;
  try {
    const base=`trips/${slug}/`;
    const t=await fetch(base+"trip.json",{cache:"no-store"}).then(r=>{if(!r.ok) throw 0; return r.json();});
    // meta.liveDataDir：價格由別的 repo 追蹤時，指向它 GitHub Pages 上的 data/（只接受 https://*.github.io/…/）
    const ld=t.meta?.liveDataDir, dataBase=(typeof ld==="string" && /^https:\/\/[a-z0-9-]+\.github\.io\/[\w.\/-]*\/$/i.test(ld)) ? ld : base+"data/";
    const [fh,hh]=await Promise.all([fetch(dataBase+"history.json",{cache:"no-store"}).then(r=>r.ok?r.json():null).catch(()=>null), fetch(dataBase+"hotels.json",{cache:"no-store"}).then(r=>r.ok?r.json():null).catch(()=>null)]);
    live={flight:Array.isArray(fh)&&fh.length?fh[fh.length-1]:null, hotels:Array.isArray(hh)&&hh.length?hh[hh.length-1]:null};
    const om={...(t.meta||{})}; trip=normalize(t,om); trip.meta={...om, source:om.source||"verified"}; live.of=trip; flightPick=null; fx=trip.localToTwd; fillForm(trip.meta); render();
    document.title=`${trip.title}｜旅程產生器`;
  } catch { $("status").className="status err"; $("status").textContent=`找不到行程「${slug}」。`; }
}
fillForm({destination:"", origin:"TPE", start:"", end:"", travelers:2, budgetTwd:60000});
$("dest").placeholder = "例：北海道 札幌・小樽・富良野";
render();
loadRepoTrip();
(async () => {
  const manualMode = () => { $("go").textContent="產生提示詞"; $("modeNote").textContent="這個網址不能直接呼叫 Claude：按下後會產生提示詞，貼到你的 Claude（不需 API 金鑰），再把回覆貼回來。已存的行程只存在這台裝置的瀏覽器，也可下載 trip.json。"; renderSaved(localDocs()); };
  if (!window.claude?.use){ manualMode(); return; }
  const [s, d, dl] = await Promise.all([claude.use("sample"), claude.use("db"), claude.use("downloads")]);
  sample = s; db = d; downloads = dl;
  if (!sample) manualMode();
  render();
  if (!db && sample) renderSaved(localDocs());
  if (db){
    db.collection("trips").orderBy("savedAt","desc").limit(30).onSnapshot(snap=>renderSaved(snap.docs), ()=>{$("savedBox").hidden=true;});
  }
})();
